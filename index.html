<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perfil do Usuário</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Cabeçalho -->
  <header>
    <h1>Perfil do Usuário</h1>
  </header>

  <main>
    <!-- Seção de Perfil -->
    <section class="profile">
      <img src="foto-perfil.jpg" alt="Foto do Usuário" class="profile-img" />
      <div class="profile-info">
        <h2>Nome do Usuário</h2>
        <p>Uma breve biografia sobre o usuário que destaca seus interesses e hobbies.</p>
      </div>
    </section>

    <!-- Painel de Informações -->
    <section class="info-panel">
      <div class="contact">
        <h3>Contato</h3>
        <p>Email: usuario@email.com</p>
        <p>Telefone: (11) 1234-5678</p>
      </div>
      <div class="social-media">
        <h3>Redes Sociais</h3>
        <p>Twitter: <a href="#">@usuario</a></p>
        <p>LinkedIn: <a href="#">linkedin.com/in/usuario</a></p>
        <p>GitHub: <a href="#">github.com/usuario</a></p>
      </div>
    </section>
  </main>

  <!-- Rodapé -->
  <footer>
    <button class="action-btn">Enviar Mensagem</button>
  </footer>
</body>
</html>
